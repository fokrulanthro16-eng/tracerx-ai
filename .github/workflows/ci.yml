name: TraceRx AI Forensic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  forensic-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libdmtx0b xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pylibdmtx pytest pytest-asyncio web3 fastapi uvicorn pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Forensic Verification Test Suite
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v --tb=short

      - name: Verify Documentation & Schemas
        run: |
          python -c "import backend.app.main; print('FastAPI Core Loaded Successfully')"
